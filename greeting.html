<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代表からのごあいさつ - ステップZERO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Georgia", serif;
      background: #fdfbf7;
      color: #333;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border: 1px solid #e0d0b0;
    }
    h1 {
      text-align: center;
      color: #5a122d;
      margin-bottom: 30px;
      font-size: 1.8rem;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 12px;
    }
    .message-body {
      line-height: 2.0;
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 40px;
    }
    .back-btn {
      display: block;
      width: 220px;
      margin: 0 auto;
      padding: 14px;
      text-align: center;
      background: #5a122d;
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      transition: background 0.3s;
    }
    .back-btn:hover {
      background: #d4af37;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>代表からのごあいさつ</h1>

    <div class="message-body">
      <h2>ようこそ ステップZERO へ</h2>
      <br>
      <p>
        私たちは品川区を拠点に活動している社交ダンスサークルです。<br>
        初心者から経験者まで、アットホームな雰囲気で楽しくダンスを踊っています。<br>
        お気軽にご参加・見学にお越しください！
      </p>
      <!-- 文面は後で見直し・追加可能なスペース -->
    </div>

    <a href="index.html" class="back-btn">← トップページに戻る</a>
  </div>

</body>
</html>
