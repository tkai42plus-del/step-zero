<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>28周年記念パーティー開催報告 - ステップZERO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #fbf7f0 0%, #f7ebe1 100%);
      color: #333;
      padding: 40px 20px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(180, 140, 100, 0.2);
      border: 2px solid #d4af37;
    }
    .header-title {
      text-align: center;
      background: linear-gradient(135deg, #800020, #5a122d);
      color: #f7e7ce;
      padding: 25px 15px;
      border-radius: 12px;
      margin-bottom: 30px;
      border: 2px solid #d4af37;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header-title h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .header-title p {
      font-size: 1.1rem;
      color: #ffd700;
      font-weight: bold;
    }

    /* 雑誌掲載レポートセクション */
    .report-section {
      background: #faf5ed;
      border: 1px solid #e5d8c0;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
    }
    .report-section h2 {
      color: #5a122d;
      font-size: 1.4rem;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-family: 'Shippori Mincho', serif;
      text-align: center;
    }
    
    /* 雑誌画像の見栄え調整 */
    .magazine-image-box {
      text-align: center;
      margin-bottom: 20px;
    }
    .magazine-image-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #d4af37;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    /* 掲載テキストのスタイリング */
    .report-text {
      line-height: 2.0;
      font-size: 1.05rem;
      color: #444;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      border-left: 5px solid #800020;
    }
    .report-text p {
      margin-bottom: 12px;
    }
    .report-meta {
      font-size: 0.9rem;
      color: #666;
      text-align: right;
      margin-top: 15px;
    }

    .back-btn {
      display: block;
      width: 220px;
      margin: 0 auto;
      padding: 14px;
      text-align: center;
      background: #5a122d;
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .back-btn:hover {
      background: #d4af37;
    }

    @media (max-width: 600px) {
      .container { padding: 20px; }
      .report-section { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <h1>ステップZERO 28周年記念ダンスパーティー</h1>
      <p>ご参加いただいた皆様、誠にありがとうございました！</p>
    </div>

    <!-- 開催報告メイン -->
    <div class="report-section">
      <h2>🎉 パーティ・グラフィティ 開催報告</h2>
      
      <!-- 雑誌掲載の写真画像を表示 -->
      <div class="magazine-image-box">
        <!-- ※画像ファイル名をご自身のファイル名（例: party28_report.jpg 等）に変更してください -->
        <img src="party28_report.jpg" alt="28周年記念パーティー雑誌掲載ページ">
      </div>

      <!-- 雑誌掲載のテキスト文章 -->
      <div class="report-text">
        <p><strong>ステップZERO 28周年記念パーティ</strong></p>
        <p>10月23日（金）／ 品川健康センター 撮影：竹内洋八</p>
        <p>品川区の品川健康センターにおいて「ステップZERO」の28周年記念パーティが盛大に開催されました。ミキシング、正装トライアル、アマデモ、ダンスタイム等、大勢のダンスファンで賑わいました。</p>
        <div class="report-meta">
          （専門誌掲載レポートより抜粋）
        </div>
      </div>
    </div>

    <a href="index.html" class="back-btn">← トップページに戻る</a>
  </div>

</body>
</html>
