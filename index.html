<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品川社交ダンスサークル：ステップZERO</title>
  <!-- ポップで読みやすいGoogle Fonts (M PLUS Rounded 1c) を読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    /* 画面全体：左右余白を明るく清潔感のあるクリーム・淡いピンク調に設定 */
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #fbf7f0 0%, #f7ebe1 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* 中央メインラッパー（幅70% / 最大1100px） */
    .site-container {
      width: 70%;
      max-width: 1100px;
      min-width: 320px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(180, 140, 100, 0.25);
      
      /* 中央部分だけに背景写真を配置 */
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                  url('写真27周年.jpg') no-repeat center top;
      background-size: cover;
      border-left: 2px solid #d4af37;
      border-right: 2px solid #d4af37;
    }

    /* ヘッダー：文字サイズをさらに大きく華やかに */
    header {
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
      padding: 30px 15px;
      border-bottom: 4px solid #f39c12;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    header h1 {
      font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", sans-serif;
      font-size: 2.3rem; /* サイズを大きく拡大 */
      font-weight: 900;
      color: #e84393;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(243, 156, 18, 0.25);
      letter-spacing: 1.5px;
      line-height: 1.3;
    }

    /* メインレイアウト（左メニュー＋右コンテンツ） */
    .main-content {
      display: flex;
      flex: 1;
      padding: 40px 30px;
      gap: 30px;
    }

    /* 左側ナビゲーション */
    .sidebar {
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,245,238,0.95));
      color: #5a122d;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05rem;
      border-radius: 25px;
      border: 2px solid #d4af37;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }
    .nav-btn:hover {
      background: #5a122d;
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }

    /* 右側メインエリア */
    .content-area {
      flex: 1;
      background: rgba(255, 255, 255, 0.93);
      padding: 35px;
      border-radius: 15px;
      border: 2px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      align-self: flex-start;
    }
    .content-area h2 {
      color: #5a122d;
      font-size: 1.5rem;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    .content-area p {
      line-height: 1.9;
      font-size: 1.05rem;
      color: #333;
    }

    /* フッター */
    footer {
      background: rgba(40, 20, 25, 0.95);
      color: #f7e7ce;
      text-align: center;
      padding: 18px;
      font-size: 0.85rem;
      border-top: 2px solid #d4af37;
    }

    /* スマホ・タブレット対応 */
    @media (max-width: 850px) {
      .site-container {
        width: 100%;
        border: none;
      }
      header h1 {
        font-size: 1.6rem;
      }
      .main-content {
        flex-direction: column;
        padding: 20px;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="site-container">
    
    <header>
      <h1>ようこそ<br>品川社交ダンスサークル：ステップZERO</h1>
    </header>

    <div class="main-content">
      <!-- 左側ナビゲーション -->
      <nav class="sidebar">
        <a href="greeting.html" class="nav-btn">代表からのごあいさつ</a>
        <a href="schedule.html" class="nav-btn">開催予定表</a>
        <a href="https://www.shinagawa.esforta.jp/access/" target="_blank" rel="noopener noreferrer" class="nav-btn">会場アクセス ↗</a>
        <a href="archive.html" class="nav-btn">過去の活動記録</a>
        <a href="contact.html" class="nav-btn">お問い合わせ（準備中）</a>
      </nav>

      <!-- 右側メインエリア -->
      <main class="content-area">
        <h2>ステップZERO へようこそ！</h2>
        <p>
          私たちは品川区を拠点に活動している社交ダンスサークルです。<br>
          初心者から経験者まで、アットホームな雰囲気で楽しくダンスを踊っています。<br><br>
          お気軽にご参加・見学にお越しください！
        </p>
      </main>
    </div>

    <footer>
      <p>&copy; 品川社交ダンスサークル：ステップZERO All Rights Reserved.</p>
    </footer>

  </div>

</body>
</html>
